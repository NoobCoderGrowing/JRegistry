host: 127.0.0.1

server:
  port: 6101


raft:
  node-id: 1
  port: 6001
  peers: "{2:'127.0.0.2:6002',3:'127.0.0.3:6003'}"
  count: 3
  auto-persist: true
  image-path: "persistency/"
  log-compaction-interval: 14400
  # Raft 协议时间参数（毫秒）。election-timeout 必须显著大于 heartbeat-interval，
  # 否则 follower 会抢在收到 leader 心跳之前发起选举，集群陷入无休止重新选主。
  timing:
    election-timeout-min-ms: 15000
    election-timeout-max-ms: 30000
    heartbeat-interval-ms: 5000
    reconnect-delay-ms: 5000
    connect-timeout-ms: 5000


admin:
  peer-http-ports: "{1:6101, 2:6102, 3:6103}"
  election-log-path: logs/JRegistry.log

# 客户端连接租约。客户端每 10s 发一次心跳（客户端常量），read-timeout 必须大于该间隔，
# 否则正常连接会被误判。连续 max-misses 次读超时即认为连接已死，把该客户端标为「离线」
# （只翻状态，不删除它 set 过的 key）。
registry:
  client-heartbeat:
    read-timeout-seconds: 20
    max-misses: 3
    retry-delay-seconds: 5
  # leader 侧的孤儿会话扫描：某个 peer 超过 peer-dead-threshold 没有任何响应（心跳 ack /
  # appendEntries 回复），就把它名下的客户端会话标为「离线」。覆盖「客户端消失 + 持有连接的
  # 节点也崩了」这一档，本地检测够不到。注意语义：被网络隔开的节点同样会被判失效，它名下活
  # 客户端也会被标离线（数据仍在）。阈值别设太小。
  session-sweep:
    enabled: true
    sweep-interval-seconds: 10
    peer-dead-threshold-seconds: 60
    leader-grace-seconds: 30
  # 离线数据 TTL 回收：客户端离线超过 ttl-seconds 后，删掉它离线期间留下的 key。
  # 注意 ttl-seconds 是「离线多久之后回收」，interval-seconds 只是「多久检查一次」——
  # 若把 interval 也设成 24h，key 最长能活到 48h。
  offline-reclaim:
    enabled: true
    ttl-seconds: 86400        # 24 小时
    interval-seconds: 600     # 每 10 分钟扫一次有没有到期的
  # 写回包（CAS 用）：日志 apply 之后，把「到底写没写进去」回给客户端。
  # 客户端连在哪个节点，就由那个节点回——不需要额外的回程消息。
  write-ack:
    timeout-seconds: 30       # 超过这么久还没 apply 就丢弃待回包记录（客户端侧更早超时）
    prune-interval-seconds: 10

ssh:
  enabled: true
  host: 127.0.0.1
  port: 2001
  host-key-path: /var/tmp/.jregistryclient_hostkey_1.ser
  auth:
    username: admin
    password: 123